<!DOCTYPE html>
<html>
<head>
  <title>Rallx browser AI</title>
  <link rel="stylesheet" type="text/css" href="sidebar.css">
</head>
<body>
  <div class="container">
    <div class="settings">
      <label for="base-url">LLM Base URL:</label>
      <input type="text" id="base-url" value="http://localhost:11434/v1">
      <div class="actions">
        <button id="refresh-models">Refresh</button>
        <button id="save-base-url">Save</button>
      </div>
    </div>
    <div class="settings">
        <label for="max-tokens">Max Context Tokens:</label>
        <input type="number" id="max-tokens" value="3098" step="128" min="128">
    </div>
    <div class="model-selection">
      <label for="model-select">Model:</label>
      <select id="model-select"></select>
    </div>
    <div class="chat-container">
      <div id="chat-history"></div>
      <div id="context-indicator" style="display: none;">
        <span id="context-text"></span>
        <button id="remove-context" title="Remove Context">&times;</button>
      </div>
      <div class="chat-input">
        <textarea id="prompt-input" placeholder="Type your message..."></textarea>
        <button id="send-prompt">Send</button>
        <button id="stop-generating" style="display: none;">Stop</button>
      </div>
    </div>
    <div class="actions">
        <button id="summarize-page">Summarize Page</button>
        <button id="clear-chat">Clear Chat</button>
    </div>
  </div>
  <script src="sidebar.js"></script>
</body>
</html>
